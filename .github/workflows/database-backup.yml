name: Encrypted PostgreSQL Backup
on:
  workflow_dispatch:
  schedule:
    - cron: "17 1 * * *"
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Create database dump
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          test -n "$DATABASE_URL"
          pg_dump "$DATABASE_URL" --format=custom --no-owner --no-privileges --file=kariyab.dump
          pg_restore --list kariyab.dump >/dev/null
      - name: Encrypt backup
        env:
          BACKUP_PASSWORD: ${{ secrets.BACKUP_ENCRYPTION_PASSWORD }}
        run: |
          test -n "$BACKUP_PASSWORD"
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 -in kariyab.dump -out kariyab.dump.enc -pass env:BACKUP_PASSWORD
          rm -f kariyab.dump
          sha256sum kariyab.dump.enc > kariyab.dump.enc.sha256
      - name: Upload encrypted backup
        uses: actions/upload-artifact@v4
        with:
          name: kariyab-db-backup-${{ github.run_id }}
          path: |
            kariyab.dump.enc
            kariyab.dump.enc.sha256
          retention-days: 7
          if-no-files-found: error

name: Kariyab Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kariyab_test
          POSTGRES_PASSWORD: integration_only
          POSTGRES_DB: kariyab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kariyab_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://kariyab_test:integration_only@localhost:5432/kariyab_test

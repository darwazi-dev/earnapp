name: Validate Latest Database Backup
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Encrypted PostgreSQL Backup"]
    types: [completed]
permissions:
  contents: read
  actions: read
jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: kariyab
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: kariyab_restore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kariyab -d kariyab_restore_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Download backup artifact
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          BACKUP_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            RUN_ID="$BACKUP_RUN_ID"
          else
            RUN_ID="$(gh run list --workflow database-backup.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          fi
          test -n "$RUN_ID"
          gh run download "$RUN_ID" --pattern 'kariyab-db-backup-*' --dir backup
          DUMP="$(find backup -type f -name 'kariyab.dump.enc' -print -quit)"
          SUM="$(find backup -type f -name 'kariyab.dump.enc.sha256' -print -quit)"
          test -n "$DUMP"
          test -n "$SUM"
          cp "$DUMP" kariyab.dump.enc
          cp "$SUM" kariyab.dump.enc.sha256
      - name: Verify and decrypt
        env:
          BACKUP_PASSWORD: ${{ secrets.BACKUP_ENCRYPTION_PASSWORD }}
        run: |
          test -n "$BACKUP_PASSWORD"
          sha256sum -c kariyab.dump.enc.sha256
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in kariyab.dump.enc -out kariyab.dump -pass env:BACKUP_PASSWORD
      - name: Restore into isolated PostgreSQL
        env:
          PGPASSWORD: test-only-password
        run: |
          pg_restore --host=127.0.0.1 --port=5432 --username=kariyab --dbname=kariyab_restore_test --no-owner --no-privileges kariyab.dump
          psql --host=127.0.0.1 --port=5432 --username=kariyab --dbname=kariyab_restore_test -v ON_ERROR_STOP=1 -c "SELECT COUNT(*) AS users FROM users;"
          psql --host=127.0.0.1 --port=5432 --username=kariyab --dbname=kariyab_restore_test -v ON_ERROR_STOP=1 -c "SELECT COUNT(*) AS ledger_rows FROM wallet_ledger;"

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>پنل ادمین — کاریاب</title>

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --green:#123832;
  --green2:#23624f;
  --cream:#f8f4e9;
  --text:#1b1b18;
  --muted:#6b6860;
  --border:#ebe4d2;
  --ok:#3e7d5a;
  --danger:#b3413a;
  --warning:#d79b2b;
  --blue:#316a9b;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:'Vazirmatn',sans-serif;
  background:var(--cream);
  color:var(--text);
}

.wrap{
  max-width:1100px;
  margin:auto;
  padding:28px 18px;
}

h1{
  color:var(--green);
  font-size:24px;
  margin:0 0 22px;
}

.card{
  background:#fff;
  border-radius:16px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:0 1px 4px rgba(0,0,0,.06);
}

.hidden{display:none!important}

input{
  width:100%;
  padding:12px 14px;
  border-radius:10px;
  border:1px solid #ddd4bd;
  font-family:inherit;
  font-size:14px;
  outline:none;
}

input:focus{
  border-color:var(--green2);
}

button{
  border:none;
  border-radius:9px;
  padding:9px 13px;
  font-family:inherit;
  font-weight:700;
  cursor:pointer;
}

button:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.btn-primary{
  background:var(--green);
  color:white;
}

.btn-approve{
  background:var(--ok);
  color:white;
}

.btn-processing{
  background:var(--blue);
  color:white;
}

.btn-paid{
  background:var(--green);
  color:white;
}

.btn-reject{
  background:var(--danger);
  color:white;
}

.btn-logout{
  background:#eee8d9;
  color:var(--text);
}

.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:12px;
  margin-bottom:18px;
}

.stat{
  background:white;
  border-radius:15px;
  padding:18px;
  text-align:center;
  box-shadow:0 1px 3px rgba(0,0,0,.04);
}

.stat .num{
  font-size:24px;
  font-weight:800;
  color:var(--green);
}

.stat .label{
  margin-top:5px;
  color:var(--muted);
  font-size:12px;
}

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:950px;
  font-size:13px;
}

th,td{
  padding:12px 9px;
  text-align:right;
  border-bottom:1px solid var(--border);
  vertical-align:middle;
}

th{
  color:var(--muted);
  font-size:12px;
  white-space:nowrap;
}

td{
  word-break:break-word;
}

.actions{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}

.pill{
  display:inline-block;
  padding:5px 10px;
  border-radius:20px;
  font-size:11px;
  font-weight:700;
  white-space:nowrap;
}

.s-requested{
  background:#fff1d6;
  color:#8a5a00;
}

.s-approved{
  background:#e6f2ea;
  color:#286744;
}

.s-processing{
  background:#e5eff8;
  color:#24577e;
}

.s-paid{
  background:#dff1e5;
  color:#1f6840;
}

.s-rejected{
  background:#f9e4e2;
  color:#9c302b;
}

.s-other{
  background:#eee;
  color:#555;
}

.err{
  color:var(--danger);
  margin-top:10px;
  font-size:13px;
}

.notice{
  padding:12px 14px;
  border-radius:10px;
  margin-bottom:16px;
  font-size:13px;
}

.notice-ok{
  background:#e6f2ea;
  color:#286744;
}

.notice-error{
  background:#f9e4e2;
  color:#9c302b;
}

.empty{
  padding:30px;
  text-align:center;
  color:var(--muted);
}

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:18px;
}

.account-cell{
  max-width:190px;
}

.ref{
  font-size:11px;
  color:var(--muted);
  margin-top:4px;
}

@media(max-width:650px){
  .wrap{padding:18px 10px}
  h1{font-size:20px}
}
</style>
</head>

<body>

<div class="wrap">

  <!-- LOGIN -->
  <div id="loginBox" class="card" style="max-width:360px;margin:70px auto">
    <h1>ورود ادمین</h1>

    <input
      id="adminPass"
      type="password"
      placeholder="رمز ادمین"
      autocomplete="current-password"
    >

    <button
      class="btn-primary"
      style="width:100%;margin-top:14px"
      onclick="adminLogin()"
    >
      ورود
    </button>

    <div id="loginError" class="err hidden"></div>
  </div>


  <!-- DASHBOARD -->
  <div id="dashboard" class="hidden">

    <div class="topbar">
      <h1 style="margin:0">پنل ادمین — کاریاب</h1>

      <button class="btn-logout" onclick="logoutAdmin()">
        خروج
      </button>
    </div>

    <div id="notice" class="hidden"></div>

    <div id="stats" class="stats"></div>

    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
        <div>
          <h3 style="margin:0 0 5px">بررسی تطبیق کیف پول</h3>
          <div id="reconcileResult" style="font-size:13px;color:var(--muted)">
            بررسی نشده
          </div>
        </div>
        <button class="btn-primary" onclick="reconcileWallets()">بررسی</button>
      </div>
    </div>

    <div class="card">

      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px">
        <h3 style="margin:0">درخواست‌های برداشت</h3>

        <button class="btn-primary" onclick="loadDashboard()">
          بروزرسانی
        </button>
      </div>

      <div class="table-wrap">
        <table>

          <thead>
            <tr>
              <th>کاربر</th>
              <th>شماره</th>
              <th>مبلغ</th>
              <th>روش</th>
              <th>حساب</th>
              <th>وضعیت</th>
              <th>Payment Reference</th>
              <th>عملیات</th>
            </tr>
          </thead>

          <tbody id="withdrawalTable"></tbody>

        </table>
      </div>

    </div>

        <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px">
        <h3 style="margin:0">هشدارهای امنیتی / Fraud Flags</h3>
        <button class="btn-primary" onclick="loadFraudFlags()">بروزرسانی</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>کاربر</th><th>نوع هشدار</th><th>شدت</th><th>جزئیات</th><th>وضعیت</th><th>بررسی دستی</th>
            </tr>
          </thead>
          <tbody id="fraudTable"></tbody>
        </table>
      </div>
    </div>

<div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px">
        <h3 style="margin:0">درخواست‌های پشتیبانی</h3>
        <button class="btn-primary" onclick="loadSupportTickets()">بروزرسانی</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Ticket ID</th>
              <th>کاربر</th>
              <th>شماره</th>
              <th>موضوع</th>
              <th>پیام</th>
              <th>وضعیت</th>
              <th>عملیات</th>
            </tr>
          </thead>
          <tbody id="supportTable"></tbody>
        </table>
      </div>
    </div>

  </div>

</div>


<script>

let ADMIN_TOKEN =
  sessionStorage.getItem('kariyabAdminToken') || '';


function escapeHtml(value){
  return String(value ?? '')
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;')
    .replaceAll("'","&#039;");
}


function showNotice(message,type='ok'){

  const el =
    document.getElementById('notice');

  el.textContent = message;

  el.className =
    'notice ' +
    (type === 'error'
      ? 'notice-error'
      : 'notice-ok');

  el.classList.remove('hidden');
}


async function adminApi(path,options={}){

  const headers = {
    'Content-Type':'application/json',
    'Authorization':'Bearer ' + ADMIN_TOKEN,
    ...(options.headers || {})
  };

  const response =
    await fetch(path,{
      ...options,
      headers
    });

  const data =
    await response
      .json()
      .catch(()=>({}));

  if(response.status === 401){

    sessionStorage.removeItem(
      'kariyabAdminToken'
    );

    ADMIN_TOKEN = '';

    throw new Error(
      'دسترسی ادمین معتبر نیست'
    );
  }

  if(!response.ok){

    throw new Error(
      data.error || 'خطای سرور'
    );
  }

  return data;
}


async function adminLogin(){

  const input =
    document.getElementById('adminPass');

  const error =
    document.getElementById('loginError');

  const password =
    input.value.trim();

  error.classList.add('hidden');

  if(!password){

    error.textContent =
      'رمز ادمین را وارد کنید';

    error.classList.remove('hidden');

    return;
  }

  try{

    const response =
      await fetch('/api/admin/login',{
        method:'POST',
        headers:{
          'Content-Type':'application/json'
        },
        body:JSON.stringify({
          password
        })
      });

    const data =
      await response
        .json()
        .catch(()=>({}));

    if(!response.ok){

      throw new Error(
        data.error ||
        'رمز ادمین اشتباه است'
      );
    }

    if(!data.token){
      throw new Error('نشست امن ادمین ایجاد نشد');
    }

    ADMIN_TOKEN = data.token;

    sessionStorage.setItem(
      'kariyabAdminToken',
      data.token
    );

    document
      .getElementById('loginBox')
      .classList.add('hidden');

    document
      .getElementById('dashboard')
      .classList.remove('hidden');

    await loadDashboard();

  }catch(e){

    error.textContent = e.message;

    error.classList.remove('hidden');
  }
}


function logoutAdmin(){

  ADMIN_TOKEN = '';

  sessionStorage.removeItem(
    'kariyabAdminToken'
  );

  location.reload();
}


function statusLabel(status){

  const map = {
    REQUESTED:'درخواست شده',
    UNDER_REVIEW:'در حال بررسی',
    APPROVED:'تأیید شده',
    PROCESSING:'در حال پردازش',
    PAID:'پرداخت شده',
    REJECTED:'رد شده',
    CANCELLED:'لغو شده',
    FAILED:'ناموفق'
  };

  return map[status] || status;
}


function statusClass(status){

  if(
    status === 'REQUESTED' ||
    status === 'UNDER_REVIEW'
  ){
    return 's-requested';
  }

  if(status === 'APPROVED'){
    return 's-approved';
  }

  if(status === 'PROCESSING'){
    return 's-processing';
  }

  if(status === 'PAID'){
    return 's-paid';
  }

  if(status === 'REJECTED'){
    return 's-rejected';
  }

  return 's-other';
}


function renderActions(w){

  const id =
    Number(w.id);

  const status =
    String(w.rawStatus || '');

  if(
    status === 'REQUESTED' ||
    status === 'UNDER_REVIEW'
  ){
    return `
      <div class="actions">

        <button
          class="btn-approve"
          onclick="approveWithdrawal(${id})"
        >
          تأیید
        </button>

        <button
          class="btn-reject"
          onclick="rejectWithdrawal(${id})"
        >
          رد
        </button>

      </div>
    `;
  }


  if(status === 'APPROVED'){

    return `
      <div class="actions">

        <button
          class="btn-processing"
          onclick="markProcessing(${id})"
        >
          شروع پردازش
        </button>

        <button
          class="btn-paid"
          onclick="markPaid(${id})"
        >
          ثبت پرداخت
        </button>

        <button
          class="btn-reject"
          onclick="rejectWithdrawal(${id})"
        >
          رد
        </button>

      </div>
    `;
  }


  if(status === 'PROCESSING'){

    return `
      <div class="actions">

        <button
          class="btn-paid"
          onclick="markPaid(${id})"
        >
          ثبت پرداخت
        </button>

      </div>
    `;
  }


  return '—';
}


async function loadDashboard(){

  try{

    const [
      stats,
      data
    ] = await Promise.all([
      adminApi('/api/admin/stats'),
      adminApi('/api/admin/withdrawals')
    ]);

    loadSupportTickets();
    loadFraudFlags();


    document.getElementById(
      'stats'
    ).innerHTML = `

      <div class="stat">
        <div class="num">
          ${escapeHtml(stats.totalUsers)}
        </div>
        <div class="label">
          کل کاربران
        </div>
      </div>

      <div class="stat">
        <div class="num">
          ${escapeHtml(stats.totalBalanceHeld)} ؋
        </div>
        <div class="label">
          موجودی نزد کاربران
        </div>
      </div>

      <div class="stat">
        <div class="num">
          ${escapeHtml(stats.pendingCount)}
        </div>
        <div class="label">
          درخواست در انتظار
        </div>
      </div>

      <div class="stat">
        <div class="num">
          ${escapeHtml(stats.pendingAmount)} ؋
        </div>
        <div class="label">
          مبلغ در انتظار
        </div>
      </div>

      <div class="stat">
        <div class="num">
          ${escapeHtml(stats.paidOut)} ؋
        </div>
        <div class="label">
          پرداخت‌شده
        </div>
      </div>
    `;


    const tbody =
      document.getElementById(
        'withdrawalTable'
      );


    if(
      !data.withdrawals ||
      !data.withdrawals.length
    ){

      tbody.innerHTML = `
        <tr>
          <td colspan="8" class="empty">
            هیچ درخواست برداشتی وجود ندارد
          </td>
        </tr>
      `;

      return;
    }


    tbody.innerHTML =
      data.withdrawals
        .map(w=>{

          const status =
            String(w.rawStatus || '');

          return `
            <tr>

              <td>
                ${escapeHtml(w.userName)}
              </td>

              <td>
                ${escapeHtml(w.userPhone)}
              </td>

              <td>
                <strong>
                  ${escapeHtml(w.amount)} ؋
                </strong>
              </td>

              <td>
                ${escapeHtml(w.method || '—')}
              </td>

              <td class="account-cell">
                ${escapeHtml(w.account || '—')}
              </td>

              <td>
                <span class="pill ${statusClass(status)}">
                  ${escapeHtml(statusLabel(status))}
                </span>
              </td>

              <td>
                ${
                  w.paymentReference
                  ? `<span class="ref">${escapeHtml(w.paymentReference)}</span>`
                  : '—'
                }
              </td>

              <td>
                ${renderActions(w)}
              </td>

            </tr>
          `;

        })
        .join('');


  }catch(e){

    showNotice(
      e.message,
      'error'
    );

    if(!ADMIN_TOKEN){

      document
        .getElementById('dashboard')
        .classList.add('hidden');

      document
        .getElementById('loginBox')
        .classList.remove('hidden');
    }
  }
}


async function approveWithdrawal(id){

  if(
    !confirm(
      'این درخواست برداشت تأیید شود؟'
    )
  ){
    return;
  }

  try{

    await adminApi(
      `/api/admin/withdrawals/${id}/approve`,
      {
        method:'POST',
        body:JSON.stringify({})
      }
    );

    showNotice(
      'درخواست برداشت تأیید شد.'
    );

    await loadDashboard();

  }catch(e){

    showNotice(
      e.message,
      'error'
    );
  }
}


async function markProcessing(id){

  if(
    !confirm(
      'پردازش این پرداخت شروع شود؟'
    )
  ){
    return;
  }

  try{

    await adminApi(
      `/api/admin/withdrawals/${id}/processing`,
      {
        method:'POST',
        body:JSON.stringify({})
      }
    );

    showNotice(
      'وضعیت به «در حال پردازش» تغییر کرد.'
    );

    await loadDashboard();

  }catch(e){

    showNotice(
      e.message,
      'error'
    );
  }
}


async function markPaid(id){

  const paymentReference =
    prompt(
      'Payment Reference / شماره مرجع پرداخت را وارد کنید:'
    );

  if(paymentReference === null){
    return;
  }

  const ref =
    paymentReference.trim();

  if(!ref){

    showNotice(
      'شماره مرجع پرداخت الزامی است.',
      'error'
    );

    return;
  }


  if(
    !confirm(
      'آیا مطمئن هستید که پول واقعاً پرداخت شده است؟'
    )
  ){
    return;
  }


  try{

    await adminApi(
      `/api/admin/withdrawals/${id}/paid`,
      {
        method:'POST',
        body:JSON.stringify({
          paymentReference:ref
        })
      }
    );

    showNotice(
      'پرداخت با موفقیت ثبت شد.'
    );

    await loadDashboard();

  }catch(e){

    showNotice(
      e.message,
      'error'
    );
  }
}


async function rejectWithdrawal(id){

  const reason =
    prompt(
      'دلیل رد درخواست را وارد کنید:'
    );

  if(reason === null){
    return;
  }

  const cleanReason =
    reason.trim();

  if(!cleanReason){

    showNotice(
      'دلیل رد درخواست را وارد کنید.',
      'error'
    );

    return;
  }


  if(
    !confirm(
      'درخواست رد شود و مبلغ به موجودی کاربر برگردد؟'
    )
  ){
    return;
  }


  try{

    await adminApi(
      `/api/admin/withdrawals/${id}/reject`,
      {
        method:'POST',
        body:JSON.stringify({
          reason:cleanReason
        })
      }
    );

    showNotice(
      'درخواست رد شد و مبلغ به کیف پول کاربر برگشت.'
    );

    await loadDashboard();

  }catch(e){

    showNotice(
      e.message,
      'error'
    );
  }
}


document
  .getElementById('adminPass')
  .addEventListener(
    'keydown',
    e=>{
      if(e.key === 'Enter'){
        adminLogin();
      }
    }
  );


if(ADMIN_TOKEN){

  document
    .getElementById('loginBox')
    .classList.add('hidden');

  document
    .getElementById('dashboard')
    .classList.remove('hidden');

  loadDashboard();
}


function supportStatusLabel(status){
  const map={
    OPEN:'باز',
    IN_PROGRESS:'در حال رسیدگی',
    RESOLVED:'حل شده',
    CLOSED:'بسته شده'
  };
  return map[status] || status;
}

async function loadSupportTickets(){
  const tbody=document.getElementById('supportTable');
  if(!tbody) return;

  try{
    const data=await adminApi('/api/admin/support/tickets');
    const tickets=Array.isArray(data.tickets) ? data.tickets : [];

    if(!tickets.length){
      tbody.innerHTML='<tr><td colspan="7" class="empty">هیچ درخواست پشتیبانی وجود ندارد</td></tr>';
      return;
    }

    tbody.innerHTML=tickets.map(t=>`
      <tr>
        <td><strong>${escapeHtml(t.ticket_id)}</strong></td>
        <td>${escapeHtml(t.user_name)}</td>
        <td>${escapeHtml(t.user_phone)}</td>
        <td>${escapeHtml(t.subject || t.category)}</td>
        <td style="max-width:260px">${escapeHtml(t.message)}</td>
        <td><span class="pill s-other">${escapeHtml(supportStatusLabel(t.status))}</span></td>
        <td>
          <select onchange="changeSupportStatus(${Number(t.id)},this.value)" style="padding:8px;border-radius:8px">
            <option value="">تغییر وضعیت</option>
            <option value="OPEN">باز</option>
            <option value="IN_PROGRESS">در حال رسیدگی</option>
            <option value="RESOLVED">حل شده</option>
            <option value="CLOSED">بسته شده</option>
          </select>
        </td>
      </tr>
    `).join('');
  }catch(e){
    tbody.innerHTML='<tr><td colspan="7" class="empty">'+escapeHtml(e.message)+'</td></tr>';
  }
}

async function changeSupportStatus(id,status){
  if(!status) return;
  try{
    await adminApi(`/api/admin/support/tickets/${id}/status`,{
      method:'POST',
      body:JSON.stringify({status})
    });
    showNotice('وضعیت درخواست پشتیبانی تغییر کرد.');
    await loadSupportTickets();
  }catch(e){
    showNotice(e.message,'error');
    await loadSupportTickets();
  }
}


async function reconcileWallets(){
  const box=document.getElementById('reconcileResult');
  box.textContent='در حال بررسی...';

  try{
    const data=await adminApi('/api/admin/wallet-reconciliation');
    if(data.ok){
      box.innerHTML='<strong style="color:var(--ok)">سالم ✓</strong> — '+escapeHtml(data.checkedUsers)+' کاربر بررسی شد و اختلافی پیدا نشد.';
    }else{
      const details=(data.mismatchUsers || []).map(u =>
        '<div style="margin-top:8px;direction:rtl">' +
        'کاربر #'+escapeHtml(u.userId)+
        ' | موجودی فعلی: '+escapeHtml(u.available)+' ؋' +
        ' | موجودی مورد انتظار: '+escapeHtml(u.expectedAvailable)+' ؋' +
        ' | اختلاف Available: '+escapeHtml(u.availableDifference)+' ؋' +
        ' | Pending فعلی: '+escapeHtml(u.pending)+' ؋' +
        ' | Pending مورد انتظار: '+escapeHtml(u.expectedPending)+' ؋' +
        ' | اختلاف Pending: '+escapeHtml(u.pendingDifference)+' ؋' +
        ' <button class="btn-primary" style="margin-right:8px;padding:5px 9px" onclick="showFinancialDiagnostics('+Number(u.userId)+')">جزئیات</button>' +
        '</div>'
      ).join('');

      box.innerHTML='<strong style="color:var(--danger)">اختلاف مالی پیدا شد</strong> — '+
        escapeHtml(data.mismatches)+' مورد از '+escapeHtml(data.checkedUsers)+
        ' کاربر. تا بررسی کامل، پرداخت جدید انجام ندهید.'+details;
    }
  }catch(e){
    box.textContent=e.message;
  }
}


async function showFinancialDiagnostics(userId){
  try{
    const data=await adminApi('/api/admin/financial-diagnostics/'+encodeURIComponent(userId));
    const lines=[
      'Wallet: '+JSON.stringify(data.wallet),
      'Transactions: '+JSON.stringify(data.transactions),
      'Ledger: '+JSON.stringify(data.ledger),
      'Withdrawals: '+JSON.stringify(data.withdrawals)
    ];
    const win=window.open('','_blank');
    if(!win){
      showNotice('مرورگر پنجره جزئیات را مسدود کرد.','error');
      return;
    }
    win.document.write('<!doctype html><meta charset="utf-8"><title>Financial Diagnostics</title><pre style="white-space:pre-wrap;word-break:break-word;font-family:monospace;padding:20px">'+escapeHtml(lines.join('\n\n'))+'</pre>');
    win.document.close();
  }catch(e){
    showNotice(e.message,'error');
  }
}


async function loadFraudFlags(){
  const tbody=document.getElementById('fraudTable');
  if(!tbody) return;
  try{
    const data=await adminApi('/api/admin/fraud-flags');
    const flags=Array.isArray(data.flags)?data.flags:[];
    if(!flags.length){
      tbody.innerHTML='<tr><td colspan="6" class="empty">هشدار امنیتی بازی وجود ندارد</td></tr>';
      return;
    }
    tbody.innerHTML=flags.map(f=>`
      <tr>
        <td>${escapeHtml(f.user_name || ('#'+f.user_id))}</td>
        <td>${escapeHtml(f.flag_type)}</td>
        <td>${escapeHtml(f.severity || '—')}</td>
        <td style="max-width:280px">${escapeHtml(typeof f.details==='string'?f.details:JSON.stringify(f.details || {}))}</td>
        <td>${escapeHtml(f.status)}</td>
        <td>
          <select onchange="changeFraudStatus(${Number(f.id)},this.value)" style="padding:8px;border-radius:8px">
            <option value="">تغییر وضعیت</option>
            <option value="OPEN">باز</option>
            <option value="UNDER_REVIEW">در حال بررسی</option>
            <option value="RESOLVED">حل شده</option>
            <option value="DISMISSED">رد هشدار</option>
          </select>
        </td>
      </tr>
    `).join('');
  }catch(e){
    tbody.innerHTML='<tr><td colspan="6" class="empty">'+escapeHtml(e.message)+'</td></tr>';
  }
}

async function changeFraudStatus(id,status){
  if(!status) return;
  try{
    await adminApi('/api/admin/fraud-flags/'+id+'/status',{
      method:'POST',
      body:JSON.stringify({status})
    });
    showNotice('وضعیت هشدار امنیتی ثبت شد.');
    await loadFraudFlags();
  }catch(e){
    showNotice(e.message,'error');
  }
}

</script>

<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تماس و پشتیبانی</title><style>body{font-family:Tahoma,Arial;background:#f7f3e8;color:#17352d;margin:0}.wrap{max-width:760px;margin:40px auto;background:#fff;padding:28px;border-radius:18px;line-height:2}a{color:#087f4f}</style></head><body><main class="wrap"><h1>تماس و پشتیبانی</h1><p>برای درآمد ثبت‌نشده، فعالیت تأییدنشده، برداشت پرداخت‌نشده، مشکل حساب یا سایر پرسش‌ها، پس از ورود از بخش «پشتیبانی» کاریاب درخواست ثبت کنید.</p><p>هر درخواست دارای شناسه پیگیری است و وضعیت آن از داخل حساب قابل مشاهده است.</p><p><a href="/">بازگشت به کاریاب</a></p></main></body></html>

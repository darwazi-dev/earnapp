<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>کاریاب — کسب درآمد آنلاین</title>
  <style>
    :root { --primary: #056839; --primary-light: #e6f4ed; --accent: #ffc107; --text: #333; --bg: #f4f7f5; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 15px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 500px; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-top: 10px; }
    h2, h3 { color: var(--primary); margin-bottom: 15px; text-align: center; }
    .input-group { margin-bottom: 15px; }
    .input-group label { display: block; margin-bottom: 5px; font-size: 13px; font-weight: bold; }
    input, select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; text-align: right; }
    button { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    .link-btn { background: none; color: var(--primary); font-size: 13px; text-decoration: underline; margin-top: 10px; font-weight: normal; }
    .hidden { display: none !important; }
    .err { color: #dc3545; font-size: 13px; margin-top: 5px; text-align: center; font-weight: bold; }
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 10px 20px; border-radius: 20px; font-size: 13px; z-index: 1000; }
    .user-card { background: linear-gradient(135deg, #056839 0%, #034626 100%); color: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; text-align: center; }
    .balance-title { font-size: 14px; opacity: 0.9; }
    .balance-amount { font-size: 32px; font-weight: bold; margin: 10px 0; }
    .task { background: white; border: 1px solid #e5e5e5; padding: 15px; border-radius: 10px; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .task-info { flex: 1; text-align: right; }
    .task-info h3 { font-size: 14px; margin: 0; text-align: right; color: #222; }
    .task-info p { font-size: 12px; color: #666; margin-top: 4px; }
    .task-reward { font-size: 16px; font-weight: bold; color: var(--primary); text-align: center; min-width: 60px; }
    .task-reward small { display: block; font-size: 10px; color: #888; font-weight: normal; }
    .task-btn { width: auto; padding: 6px 12px; font-size: 13px; margin-top: 0; }
    .withdraw-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; padding: 15px; z-index: 999; }
    .modal-content { background: white; width: 100%; max-width: 450px; padding: 20px; border-radius: 12px; max-height: 85vh; overflow-y: auto; }
    .wd-item { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #eee; font-size: 13px; }
    .status-pill { padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; }
    .status-pending { background: #fff3cd; color: #856404; }
    .status-approved { background: #d4edda; color: #155724; }
    .status-rejected { background: #f8d7da; color: #721c24; }
  </style>
</head>
<body>

  <div class="container">
    <div id="toast" class="toast hidden"></div>

    <!-- فرم ورود -->
    <div id="view-login">
      <h2>ورود به کاریاب</h2>
      <div class="input-group">
        <label>شماره تلفن</label>
        <input type="text" id="login-phone" placeholder="مثال: 0799123456">
      </div>
      <div class="input-group">
        <label>رمز عبور</label>
        <input type="password" id="login-password" placeholder="••••••••">
      </div>
      <div id="login-err" class="err hidden"></div>
      <button onclick="doLogin()">ورود</button>
      <button class="link-btn" onclick="showView('register')">هنوز حساب ندارید؟ ثبت‌نام کنید</button>
      <button class="link-btn" onclick="openForgotModal()" style="color: #666; text-decoration: none; display: block; margin: 10px auto 0;">رمز عبور را فراموش کرده‌اید؟</button>
    </div>

    <!-- فرم ثبت نام -->
    <div id="view-register" class="hidden">
      <h2>ثبت‌نام حساب جدید</h2>
      <div class="input-group">
        <label>نام و تخلص</label>
        <input type="text" id="reg-name" placeholder="احمد احمدی">
      </div>
      <div class="input-group">
        <label>شماره تلفن</label>
        <input type="text" id="reg-phone" placeholder="0799123456">
      </div>
      <div class="input-group">
        <label>رمز عبور (حداقل ۴ کاراکتر)</label>
        <input type="password" id="reg-password" placeholder="••••••••">
      </div>
      <div class="input-group" style="background: #fdfdfe; padding: 10px; border: 1px dashed var(--primary); border-radius: 8px;">
        <label style="color: var(--primary);">سوال امنیتی (برای بازیابی رمز در آینده)</label>
        <select id="reg-question" style="margin-bottom: 10px;">
          <option value="شهر تولد شما چیست؟">شهر تولد شما چیست؟</option>
          <option value="نام اولین مکتب شما چیست؟">نام اولین مکتب شما چیست؟</option>
          <option value="نام غذای مورد علاقه شما چیست؟">نام غذای مورد علاقه شما چیست؟</option>
        </select>
        <label>پاسخ سوال امنیتی</label>
        <input type="text" id="reg-answer" placeholder="پاسخ خود را دقیق بنویسید">
      </div>
      <div id="register-err" class="err hidden"></div>
      <button onclick="doRegister()">ایجاد حساب</button>
      <button class="link-btn" onclick="showView('login')">حساب دارید؟ وارد شوید</button>
    </div>

    <!-- صفحه اصلی برنامه -->
    <div id="view-main" class="hidden">
      <div class="user-card">
        <div style="display:flex; justify-content:space-between; font-size:13px; margin-bottom:10px;">
          <span id="user-name">کاربر</span>
          <span onclick="logout()" style="cursor:pointer; text-decoration:underline; opacity:0.9;">خروج</span>
        </div>
        <div class="balance-title">موجودى شما</div>
        <div class="balance-amount">؋ <span id="balance">0</span></div>
        <div style="font-size:11px; opacity:0.8;">حداقل برداشت: ۵۰۰ افغانی</div>
      </div>

      <h3 style="text-align:right; font-size:15px; margin-bottom:10px;">تسک‌های امروز</h3>
      <div id="tasks-list"></div>

      <button onclick="openWithdraw()" style="margin-top:20px; background:#044d2b;">برداشت پول ؋</button>
    </div>
  </div>

  <!-- مـودال فراموشی رمز عبور -->
  <div id="forgot-modal" class="withdraw-modal hidden">
    <div class="modal-content">
      <h3>بازیابی رمز عبور</h3>
      
      <!-- گام اول: وارد کردن شماره تلفن -->
      <div id="forgot-step1">
        <div class="input-group">
          <label>شماره تلفن خود را وارد کنید</label>
          <input type="text" id="forgot-phone" placeholder="0799123456">
        </div>
        <button onclick="checkForgotPhone()">ادامه</button>
      </div>

      <!-- گام دوم: پاسخ به سوال امنیتی -->
      <div id="forgot-step2" class="hidden">
        <div class="input-group">
          <label>سوال امنیتی حساب شما:</label>
          <div id="forgot-question-text" style="background:#eee; padding:12px; border-radius:8px; font-weight:bold; font-size:14px; margin-bottom:10px;"></div>
          <label>پاسخ شما</label>
          <input type="text" id="forgot-answer" placeholder="پاسخ دقیق را بنویسید">
        </div>
        <div class="input-group">
          <label>رمز عبور جدید</label>
          <input type="password" id="forgot-new-password" placeholder="••••••••">
        </div>
        <button onclick="submitResetPassword()">تغییر رمز عبور و ورود</button>
      </div>

      <div id="forgot-err" class="err hidden" style="margin-bottom: 10px;"></div>
      <button onclick="closeForgotModal()" style="background:#666; margin-top:10px;">انصراف</button>
    </div>
  </div>

  <!-- مودال برداشت وجه -->
  <div id="withdraw-modal" class="withdraw-modal hidden">
    <div class="modal-content">
      <h3>درخواست برداشت وجه</h3>
      <div class="input-group">
        <label>مبلغ (افغانی)</label>
        <input type="number" id="wd-amount" placeholder="حداقل 500">
      </div>
      <div class="input-group">
        <label>روش پرداخت</label>
        <select id="wd-method">
          <option value="HesabPay">HesabPay</option>
          <option value="M-Paisa">M-Paisa (Roshan)</option>
          <option value="Hawala">حواله صرافی</option>
        </select>
      </div>
      <div class="input-group">
        <label>نمبر حساب / شماره تماس یا مشخصات صرافی</label>
        <input type="text" id="wd-account" placeholder="شماره حساب یا نام صرافی">
      </div>
      <div id="wd-err" class="err hidden"></div>
      <button onclick="submitWithdraw()">ثبت درخواست</button>
      <button onclick="closeWithdraw()" style="background:#666; margin-top:10px;">بستن صفحه</button>
      <div id="wd-history" style="margin-top:20px;"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>

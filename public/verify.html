<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>احراز هویت — کاریاب</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f3ea;font-family:Tahoma,Arial,sans-serif;color:#123}
main{max-width:520px;margin:24px auto;padding:16px}.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 4px 18px #0001}
h2{margin-top:0}.hint{font-size:13px;color:#667;margin-bottom:16px}label{display:block;margin:14px 0 6px;font-weight:700}
input,select,button,a{width:100%;padding:13px;border:1px solid #ddd;border-radius:10px;font:inherit}
button{margin-top:16px;background:#12463d;color:#fff;border:0;font-weight:700}.back{display:block;margin-top:10px;text-align:center;color:#333;text-decoration:none}
.err{background:#fdeaea;color:#a11;padding:10px;border-radius:8px;margin-top:12px}.ok{background:#e8f7ee;color:#175b37;padding:10px;border-radius:8px;margin-top:12px}
</style>
</head>
<body><main><div class="card">
<h2>احراز هویت برای برداشت</h2>
<p class="hint">برای تست فعلاً از تصویر غیرحساس/آزمایشی استفاده کنید. پس از ارسال، درخواست توسط ادمین بررسی می‌شود.</p>
<div id="status" class="hint">در حال دریافت وضعیت...</div>
<label>نوع مدرک</label><select id="type"><option value="NATIONAL_ID">تذکره / مدرک ملی</option><option value="PASSPORT">پاسپورت</option><option value="OTHER">مدرک دیگر</option></select>
<label>شماره مدرک</label><input id="number" maxlength="80" autocomplete="off">
<label>تصویر مدرک</label><input id="doc" type="file" accept="image/jpeg,image/png,image/webp">
<label>سلفی واضح</label><input id="selfie" type="file" accept="image/jpeg,image/png,image/webp" capture="user">
<div id="msg"></div><button id="submit" type="button">ارسال برای بررسی</button><a class="back" href="/">بازگشت به کاریاب</a>
</div></main>
<script>
const token=localStorage.getItem('token')||localStorage.getItem('kariyabToken')||'';
const msg=document.getElementById('msg'),statusEl=document.getElementById('status'),btn=document.getElementById('submit');
async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{}),...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'درخواست انجام نشد');return d}
async function image(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=()=>reject(new Error('خواندن تصویر ناموفق بود'));reader.onload=()=>{const im=new Image();im.onerror=()=>reject(new Error('تصویر معتبر نیست'));im.onload=()=>{let w=im.width,h=im.height,m=Math.max(w,h);if(m>900){const s=900/m;w=Math.round(w*s);h=Math.round(h*s)}const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(im,0,0,w,h);resolve(cv.toDataURL('image/jpeg',.68))};im.src=reader.result};reader.readAsDataURL(file)})}
async function load(){if(!token){statusEl.textContent='نشست کاربر پیدا نشد؛ دوباره وارد حساب شوید.';btn.disabled=true;return}try{const d=await api('/api/identity-verification');statusEl.textContent='وضعیت: '+(d.status||'UNVERIFIED');if(['UNDER_REVIEW','VERIFIED'].includes(d.status)){btn.disabled=true;btn.textContent=d.status==='VERIFIED'?'هویت تأیید شده':'در حال بررسی'}}catch(e){statusEl.textContent=e.message}}
btn.addEventListener('click',async()=>{msg.className='';msg.textContent='';const n=document.getElementById('number').value.trim(),df=document.getElementById('doc').files[0],sf=document.getElementById('selfie').files[0];if(n.length<4||!df||!sf){msg.className='err';msg.textContent='شماره مدرک و هر دو تصویر را کامل وارد کنید';return}try{btn.disabled=true;btn.textContent='در حال ارسال...';const [documentImage,selfieImage]=await Promise.all([image(df),image(sf)]);await api('/api/identity-verification',{method:'POST',body:JSON.stringify({documentType:document.getElementById('type').value,documentNumber:n,documentImage,selfieImage})});msg.className='ok';msg.textContent='درخواست برای بررسی ارسال شد.';statusEl.textContent='وضعیت: UNDER_REVIEW';btn.textContent='در حال بررسی'}catch(e){msg.className='err';msg.textContent=e.message;btn.disabled=false;btn.textContent='ارسال برای بررسی'}});load();
</script></body></html>
